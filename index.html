<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>कथा सागर</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#FFF6E8;color:#5C0606;overflow-x:hidden}

/* TOP HEADER */
header{background:#FFF6E8;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #F0D9B0;position:sticky;top:0;z-index:10}
.logo-top{display:flex;align-items:center;gap:8px;font-size:28px;font-weight:900;color:#7A0A0A}
.logo-top span{border:2px solid #C00000;border-radius:10px;padding:2px 7px;color:#C00000;font-size:24px}
.h-btn{width:40px;height:40px;border:none;background:none;font-size:22px;color:#C00000;cursor:pointer}

/* CENTER KATHA SAGAR */
.center-box{text-align:center;padding:35px 15px 10px}
.om-circle{
  width:170px;height:170px;margin:0 auto;
  border:3px solid #C00000;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  position:relative;background:#FFFDF5;
}
.om-circle::before{content:'';position:absolute;inset:6px;border:1px solid #C00000;border-radius:50%}
.om-circle span{font-size:100px;color:#C00000;line-height:1}
.center-title{font-size:64px;font-weight:900;color:#A00A0A;line-height:1;margin-top:15px}
.center-sub{font-size:17px;font-weight:700;color:#7A0A0A;margin-top:10px}
.divider{width:200px;height:2px;background:#C00000;margin:18px auto;opacity:.4;position:relative}
.divider::after{content:'◆';position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:#FFF6E8;padding:0 6px;color:#C00000;font-size:12px}

/* MATSYA BANNER */
.wrap{max-width:720px;margin:0 auto;padding:10px 14px 100px}
.banner{background:#C00000;color:#fff;text-align:center;padding:22px 10px;border-radius:14px}
.banner h1{font-size:36px}
.banner p{font-size:16px;margin-top:6px}
.btn-read{display:block;margin:18px auto 0;background:#C00000;color:#fff;border:none;padding:13px 35px;border-radius:10px;font-size:20px;font-weight:800;cursor:pointer}
.two-btn{display:flex;gap:12px;justify-content:center;margin-top:18px}
.two-btn button{background:#FFF6E8;border:1.5px solid #C00000;color:#7A0A0A;padding:10px 18px;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer}

/* SIDEBAR */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
.overlay.show{display:block}
.sidebar{position:fixed;top:0;left:-300px;width:280px;height:100%;background:#FFF6E8;z-index:30;transition:.3s;box-shadow:5px 0 20px rgba(0,0,0,.3)}
.sidebar.open{left:0}
.side-head{background:#C00000;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:900}
.side-head button{background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
.sidebar a{display:flex;gap:12px;padding:15px 18px;text-decoration:none;color:#5C0606;font-size:19px;font-weight:600;border-bottom:1px solid #F0D9B0}

/* BOTTOM NAV */
.bottom{position:fixed;bottom:0;left:0;right:0;background:#FFF6E8;border-top:2px solid #C00000;display:flex;justify-content:space-around;padding:9px 0;z-index:10}
.bottom div{text-align:center;font-size:13px;color:#7A0A0A;font-weight:700;cursor:pointer}
.bottom div b{display:block;font-size:22px}

@media(max-width:480px){.center-title{font-size:52px}.om-circle{width:145px;height:145px}.om-circle span{font-size:85px}}
</style>
</head>
<body>

<header>
  <div class="logo-top"><span>ॐ</span> कथा सागर</div>
  <div style="display:flex;gap:2px">
    <button class="h-btn">🔍</button>
    <button class="h-btn">♥</button>
    <button class="h-btn" onclick="openMenu()">☰</button>
  </div>
</header>

<!-- SIDEBAR -->
<div class="overlay" id="overlay" onclick="closeMenu()"></div>
<div class="sidebar" id="sidebar">
  <div class="side-head"><span>ॐ कथा सागर</span><button onclick="closeMenu()">✕</button></div>
  <a href="#" onclick="closeMenu()">🏠 होम</a>
  <a href="#" onclick="showPage('पुस्तकें')">📚 पुस्तकें</a>
  <a href="#" onclick="showPage('कथा संग्रह')">📖 कथा संग्रह</a>
  <a href="#" onclick="showPage('व्रत')">🪔 व्रत</a>
  <a href="#" onclick="showPage('मंत्र')">📿 मंत्र</a>
  <a href="#" onclick="showPage('सहस्त्रनामावली')">📜 सहस्त्रनामावली</a>
  <a href="#" onclick="showPage('भजन')">🎵 भजन</a>
  <a href="#" onclick="showPage('मेरा खाता')">👤 मेरा खाता</a>
</div>

<!-- CENTER KATHA SAGAR -->
<div class="center-box">
  <div class="om-circle"><span>ॐ</span></div>
  <div class="center-title">कथा सागर</div>
  <div class="center-sub">सनातन कथाओं • व्रत • मंत्र • भजन का सागर</div>
  <div class="divider"></div>
</div>

<div class="wrap">
  <div class="banner">
    <h1>मत्स्य महापुराण</h1>
    <p>रचयिता : महर्षि वेदव्यास • अब रु. 300-00 में उपलब्ध</p>
  </div>
  <button class="btn-read" onclick="showPage('मत्स्य महापुराण')">📖 अभी पढ़ें</button>
  <div class="two-btn">
    <button onclick="showPage('सभी पुस्तकें')">📜 सभी पुस्तकें</button>
    <button onclick="showPage('कथा संग्रह')">📖 कथा संग्रह</button>
  </div>
</div>

<div class="bottom">
  <div onclick="showPage('होम')"><b>🏠</b>होम</div>
  <div onclick="showPage('पुस्तकें')"><b>📚</b>पुस्तकें</div>
  <div onclick="showPage('खोज')"><b>🔍</b>खोज</div>
  <div><b>🛒</b>कार्ट</div>
  <div onclick="showPage('प्रोफाइल')"><b>👤</b>प्रोफाइल</div>
</div>

<script>
function openMenu(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')}
function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
function showPage(n){closeMenu();alert(n+' वाला पेज जल्द खुलेगा')}
</script>
</body>
</html>
